<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bombers — сервер временно отключён</title>
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: local('Inter');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0d0d10;
    background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 128, 0.12), transparent 60%);
    color: #e8e8ec;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #16161c;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 24px;
    padding: 48px 36px;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FF0080;
    padding: 6px 14px;
    border: 1px solid rgba(255, 0, 128, 0.35);
    border-radius: 999px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 26px;
    line-height: 1.3;
    font-weight: 700;
    margin-bottom: 14px;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #9a9aa5;
    margin-bottom: 32px;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 15px 24px;
    background: #FF0080;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 14px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(255, 0, 128, 0.35);
  }
  .foot {
    margin-top: 24px;
    font-size: 13px;
    color: #55555f;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Bombers</span>
    <h1>Игра временно недоступна</h1>
    <p>Нет денег на сервер, поэтому сервер временно отключён. Мы вернёмся, как только сможем оплатить хостинг. Новости и старты матчей — в телеграм-группе.</p>
    <a class="btn" href="https://t.me/+Prf6RmgkoAg2ZGMy" target="_blank" rel="noopener noreferrer">Телеграм-группа →</a>
    <div class="foot">bombersgame.ru</div>
  </main>
</body>
</html>
